<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10264b"><title>Đăng ký tài khoản | ZOLO</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/register.css?v=logo-fix-20261121"></head>
<body><header><a class="brand" href="/"><img class="shield brand-logo-img" src="/assets/logo.png" width="44" height="48" alt=""><span><b>ZOLO</b><small>Bảo hành dễ dàng – An tâm sử dụng</small></span></a><a class="back-home" href="/">← Trang chủ</a></header><main><section class="register-card"><div class="intro"><span class="intro-icon">✓</span><h1>Tạo tài khoản ZOLO</h1><p>Đăng ký tài khoản khách hàng để bắt đầu sử dụng dịch vụ.</p><div class="secure-note">Thông tin tài khoản được gửi đến hệ thống đăng ký hiện có.</div></div><form id="register-form" novalidate><label for="username">Tên đăng nhập</label><input id="username" name="username" autocomplete="username" minlength="3" required placeholder="Ít nhất 3 ký tự"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="ban@example.com"><label for="password">Mật khẩu</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required placeholder="Ít nhất 6 ký tự"><label for="confirm-password">Xác nhận mật khẩu</label><input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required placeholder="Nhập lại mật khẩu"><p class="message" id="form-message" role="alert" aria-live="polite"></p><button type="submit" id="submit-button"><span class="spinner"></span><span class="button-label">Đăng ký tài khoản</span></button><p class="signin">Đã có tài khoản? <a href="/login">Đăng nhập</a></p></form></section></main><footer>© 2026 truongvantruong</footer><script src="/js/register.js" defer></script></body></html>

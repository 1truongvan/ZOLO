<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#078dd3">
  <meta name="description" content="Đăng nhập hệ thống zolo.">
  <title>Đăng nhập | zolo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/login.css?v=logo-fix-20261121">
</head>
<body>
  <main class="login-page">
    <div class="decoration decoration-pink" aria-hidden="true"></div>
    <div class="decoration decoration-cyan" aria-hidden="true"></div>
    <div class="dot-cluster dots-top" aria-hidden="true">•••<br>•••<br>•••</div>
    <div class="dot-cluster dots-bottom" aria-hidden="true">•••<br>•••<br>•••</div>
    <span class="plus plus-one" aria-hidden="true">+</span><span class="plus plus-two" aria-hidden="true">+</span><span class="plus plus-three" aria-hidden="true">+</span>

    <section class="login-card" aria-label="Đăng nhập zolo">
      <nav class="quick-menu" aria-label="Các chức năng">
        <a class="quick-link quick-home" href="/" aria-label="Trang chủ"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="m5 22 19-16 19 16M10 19v23h28V19M19 42V28h10v14"/></svg><span>Trang chủ</span></a>
        <a class="quick-link quick-activate" href="/#activate"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="m10 25 9 9L39 13"/></svg><span>Kích hoạt bảo hành</span></a>
        <a class="quick-link quick-register" href="/#register"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="m24 5 16 6v12c0 10-6 16-16 21C14 39 8 33 8 23V11z"/><path d="m17 24 5 5 10-11"/></svg><span>Đăng ký bảo hành</span></a>
        <a class="quick-link quick-lookup" href="/#lookup"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="20" cy="20" r="13"/><path d="m30 30 13 13"/></svg><span>Tra cứu bảo hành</span></a>
      </nav>

      <section class="login-panel">
        <a class="login-brand" href="/" aria-label="zolo, về trang chủ">
          <img class="brand-mark brand-logo-img" src="/assets/logo.png" width="44" height="48" alt="">
          <span><b>ZOLO</b></span>
        </a>
        <div class="welcome"><h1>Welcome Back!</h1><p>Sign in to continue to zolo.</p></div>
        <form id="login-form" novalidate>
          <label class="sr-only" for="username">Username</label>
          <div class="input-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20v-1.5a6.5 6.5 0 0 1 13 0V20M16 5.5a3.5 3.5 0 0 1 0 6.8M18 14a5.5 5.5 0 0 1 3.5 5.1V20"/></svg><input id="username" name="username" type="text" placeholder="Username" autocomplete="username" minlength="3" maxlength="100" required></div>
          <label class="sr-only" for="password">Password</label>
          <div class="input-wrap password-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="10" width="15" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg><input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required><button class="password-toggle" type="button" aria-label="Hiện mật khẩu" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div>
          <label class="remember"><input id="remember" name="remember" type="checkbox"><span class="checkmark" aria-hidden="true"></span><span>Remember me</span></label>
          <p class="form-message" id="form-message" role="alert" aria-live="polite"></p>
          <button class="submit-button" id="submit-button" type="submit"><span class="button-label">Log In</span><span class="spinner" aria-hidden="true"></span></button>
        </form>
      </section>
    </section>
    <footer class="login-footer">© 2026 truongvantruong</footer>
  </main>
  <script src="/js/login.js" defer></script>
</body>
</html>
